<!DOCTYPE html>
<html>

<head>

<title>AI Resume Analyzer</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

<link rel="stylesheet" href="/style.css">
</head>

<body>


<div class="container text-center home-container">

<h1 class="main-title">
AI Resume Analyzer
</h1>


<p class="subtitle">
Build Your Dream Career With AI
</p>


<div class="feature-box">

<h3>What You'll Get</h3>

<ul>

<li>ATS Score Analysis</li>
<li>Technical Skill Extraction</li>
<li>Missing Skills Detection</li>
<li>Career Suggestions</li>
<li>Recommended Courses</li>
<li>AI Resume Feedback</li>

</ul>

</div>



<div class="upload-card">

<h3>Upload Your Resume (PDF)</h3>

<br>

<form action="/upload"
method="POST"
enctype="multipart/form-data">

<input type="file"
name="resume"
required>

<br><br>

<button type="submit"
class="btn btn-lg analyze-btn">

Analyze My Resume

</button>


</form>

</div>


</div>

</body>
</html>
